            display: none;
        }

        .gallery-resize-handle {

            right: 0;
            top: 0;
            bottom: 0;
            width: 10px;
            cursor: ew-resize;
            background: #f0f0f0;
            height: 100vh;
        }

        .gallery-content {

        .gallery-wrapper {

            flex-direction: column;

            width: auto;

        .gallery-images {

        .gallery-image {

        /* Trailer styling */
        .film-trailer {

            z-index: 200;

            /* background: white; */

        }

        .trailer-container {
            position: relative;
            /* top: calc(100vh / 6); 1/6th of viewport height from top */
            width: 100%;
            height: calc(100vh - 60px); /* Full viewport height minus navbar */
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 2rem; /* Space for the sticky trailer */
        }

        .trailer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            max-width: 66.666vw; /* 2/3 of viewport width */
            margin-top: calc(100vh / 12); /* 1/12th of viewport height from top */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .film-layout {
                flex-direction: column;
                padding: 1rem;
            }

            .film-poster,
            .film-content {
                max-width: 100%;
            }

            .gallery-container {
                position: relative;
                width: 100%;
                height: 400px;
                resize: vertical;
            }

            .film-trailer {
                position: relative;
                bottom: auto;
                left: auto;
                transform: none;
                width: 100%;
                height: 300px;
                margin-top: 2rem;
            }

            // Function to load images from the stills directory
            async function loadStillImages() {
                if (!pageData.stills) return;

                try {
                    const response = await fetch(pageData.stills);
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const links = Array.from(doc.querySelectorAll('a'));

                    const imageFiles = links
                        .map(link => link.href)
                        .filter(href => href.match(/\.(jpg|jpeg|png|gif)$/i))
                        .map(href => href.split('/').pop());

                    const galleryContainer = document.getElementById('gallery-images');
                    imageFiles.forEach(filename => {
                        const img = document.createElement('img');
                        img.src = pageData.stills + filename;
                        img.alt = 'Film Still';
                        img.className = 'gallery-image';
                        galleryContainer.appendChild(img);
                    });
                } catch (error) {
                    console.error('Error loading stills:', error);
                }
            }

            // Initialize gallery
            loadStillImages();

            // Make gallery resizable
            const gallery = document.querySelector('.gallery-container');
            const handle = document.querySelector('.gallery-resize-handle');

            if (handle && gallery) {
                let isResizing = false;
                let startX;
                let startWidth;

                handle.addEventListener('mousedown', (e) => {
                    isResizing = true;
                    startX = e.clientX;
                    startWidth = gallery.offsetWidth;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isResizing) return;

                    const width = startWidth - (e.clientX - startX);
                    if (width > 200 && width < window.innerWidth * 0.8) {
                        gallery.style.width = width + 'px';
                    }
                });

                document.addEventListener('mouseup', () => {
                    isResizing = false;
                });
            }
